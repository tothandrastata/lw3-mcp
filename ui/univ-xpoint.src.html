<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosspoint</title>
<style>
  /*
   * Self-contained styling only: no @import, no external fonts, no url()
   * references. The host's CSP blocks anything this page would try to fetch,
   * so every asset it needs has to already be inline here.
   */
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #d8d8d8;
    --header-bg: #f4f4f5;
    --selected-bg: #2563eb;
    --selected-fg: #ffffff;
    --disabled-bg: #f2f2f2;
    --disabled-fg: #9a9a9a;
    --enabled-hover: #eef4ff;
    --banner-bg: #fff4e5;
    --banner-fg: #7a4a00;
    --banner-border: #f0c98a;
    --focus-ring: #2563eb;
    /* Signal presence. Tinted headers rather than saturated blocks: they sit
       beside the selected-cell blue and must not compete with it. */
    --signal-yes-bg: #e3f5e6;
    --signal-yes-fg: #1c5b2a;
    --signal-no-bg: #f6f6f7;
    --signal-no-fg: #77777d;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1f22;
      --fg: #e8e8ea;
      --muted: #9a9aa2;
      --border: #3a3b3f;
      --header-bg: #2a2b2f;
      --selected-bg: #3b82f6;
      --selected-fg: #0b0d12;
      --disabled-bg: #26272b;
      --disabled-fg: #6a6b70;
      --enabled-hover: #223049;
      --banner-bg: #3a2c10;
      --banner-fg: #f0c98a;
      --banner-border: #5a4520;
      --focus-ring: #6ea8ff;
      --signal-yes-bg: #1d3b26;
      --signal-yes-fg: #86d99b;
      --signal-no-bg: #26272b;
      --signal-no-fg: #77787e;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* The host sizes this frame from what we report, but a frame with no
       intrinsic height renders as nothing if that report never arrives -- and
       an error we cannot see is an error we cannot fix. */
    min-height: 320px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
  }

  #app { padding: 0.75rem; min-height: 7rem; box-sizing: border-box; }

  /* Deliberately loud and hardcoded, exactly like the probe panel that did
     render. It owes nothing to the theme variables, the host's sizing or the
     transport, so it shows even when everything after it fails. Temporary:
     remove once the panel is confirmed working. */
  #stage[hidden] { display: none; }

  #auth[hidden] { display: none; }
  #auth {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
    padding: 0.6rem 0.75rem;
    margin: 0 0 0.75rem;
    border: 1px solid var(--banner-border);
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 4px;
  }
  #auth input { flex: 1 1 8rem; min-width: 6rem; padding: 0.25rem 0.4rem; }
  #auth button { padding: 0.25rem 0.7rem; cursor: pointer; }
  #stage {
    background: #b00020;
    color: #ffffff;
    font: 12px/1.5 ui-monospace, Consolas, monospace;
    padding: 0.5rem 0.75rem;
    margin: -0.75rem -0.75rem 0.75rem;
    word-break: break-word;
  }

  .panel-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }

  .panel-header h1 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
  }

  .status {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .banner {
    margin: 0 0 0.5rem;
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--banner-border);
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 4px;
    font-size: 0.8rem;
  }
  .banner[hidden] { display: none; }

  .empty-state {
    padding: 1rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* Dim the last-known grid rather than hide it, so a stale read still shows
     the last thing that was actually true. */
  #app.stale .table-wrap { opacity: 0.55; }

  .table-wrap { overflow-x: auto; }

  table {
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  th, td {
    border: 1px solid var(--border);
    padding: 0.35rem 0.55rem;
    text-align: center;
  }

  thead th {
    background: var(--header-bg);
    font-weight: 600;
    white-space: nowrap;
  }

  tbody th {
    background: var(--header-bg);
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
  }

  th.corner { background: var(--bg); border: none; }

  /* Port headers only. A cell's colour already means routing; overloading it
     with signal state would make both harder to read. */
  th.signal-yes { background: var(--signal-yes-bg); color: var(--signal-yes-fg); }
  th.signal-no { background: var(--signal-no-bg); color: var(--signal-no-fg); }
  /* signalPresent === null gets no class: the device never reported it, which
     is not the same claim as reporting no signal. */


  td.cell { min-width: 2.75rem; color: var(--disabled-fg); }

  /* Port names are long ("Welcome Screen") and the frame is narrow, so a
     single-line header pushes most of the grid out of view behind a scrollbar.
     Wrapping trades header height, of which there is plenty, for width, of
     which there is not. */
  thead th {
    white-space: normal;
    word-break: break-word;
    max-width: 5.5rem;
  }

  td.cell[data-dest] {
    cursor: pointer;
    color: var(--fg);
  }
  td.cell[data-dest] { cursor: pointer; }
  td.cell[data-dest]:hover { background: var(--enabled-hover); }
  /* The routed cell is clickable too, to undo the route. Its hover has to differ
     from the plain one, or it reads as "already done, nothing to click". */
  td.cell.selected[data-dest]:hover { filter: brightness(1.15); }
  td.cell[data-dest]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: -2px;
  }

  td.cell.disabled {
    background: var(--disabled-bg);
    color: var(--disabled-fg);
    font-size: 0.72rem;
  }

  td.cell.selected {
    background: var(--selected-bg);
    color: var(--selected-fg);
  }

  .dot {
    display: inline-block;
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    background: currentColor;
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage" hidden></div>
  <header class="panel-header">
    <h1>Crosspoint</h1>
    <div id="status" class="status" aria-live="polite"></div>
  </header>
  <div id="banner" class="banner" role="alert" hidden></div>
  <form id="auth" hidden>
    <label for="auth-password">Device admin password:</label>
    <input id="auth-password" type="password" autocomplete="current-password">
    <button type="submit">Connect and switch</button>
  </form>
  <div class="table-wrap">
    <table id="grid" aria-label="Crosspoint routing"></table>
  </div>
</div>
<script type="module">
/* __MCP_APPS_SDK__ */

'use strict';

// ---------------------------------------------------------------------
// src/univ-xpoint.js, injected verbatim by scripts/build-panel.js.
//
// This iframe is sandboxed and cannot import from the server's filesystem, so
// the grid model has to live inside this document. It used to be pasted here by
// hand, under a comment warning that the copy must be kept in step. It was not:
// a cellState fix landed in the module only, and the panel went on marking every
// cell Unavailable while tests covering the module passed. Generating the copy
// removes the possibility.
// ---------------------------------------------------------------------

/* __XPOINT_MODEL__ */

// ---------------------------------------------------------------------
// MCP Apps transport. The official SDK is inlined directly above this by
// scripts/build-panel.js. App.connect() owns the ui/initialize handshake,
// the initialized notification, and the size reporting the host needs to
// give this frame a height. All three were hand-rolled here before, and
// all three were places to get the wire format subtly wrong.
// ---------------------------------------------------------------------

const POLL_MS = 3000;

const app = new App({ name: 'lw3-univ-xpoint', version: '1.0.0' });

// Registered before connect(): the SDK does not deliver events to handlers
// attached afterwards.
app.onerror = (err) => { console.error('[xpoint] app error:', err); };

// The host delivers the tool's result here. This -- not polling -- is how the
// panel gets its data: app-initiated tool calls reach a different server
// instance than the one holding the device connection, so the grid has to
// arrive with the result that opened the panel.
//
// Registered before connect(): the SDK does not deliver to handlers attached
// afterwards, and this one carries the only data the panel will ever see.
app.ontoolresult = (result) => {
  try {
    const grid = result && result.structuredContent;
    if (!grid || !grid.destinations || !grid.sources) return;
    if (grid.connection) {
      // A different device than this panel last saw: whatever password was
      // entered for the old one is not this one's, and the instance's
      // connection points somewhere else.
      if (connection && connection.host !== grid.connection.host) {
        devicePassword = null;
        selfConnected = false;
      }
      connection = grid.connection;
    }
    lastGrid = grid;
    hydrated = true;
    render(grid);
    setBanner(null);
    setStatus('Updated ' + new Date().toLocaleTimeString());
    stage(null);
    reportSize();
  } catch (err) {
    stage('tool-result render FAILED: ' + (err && err.message ? err.message : String(err)));
  }
};

/**
 * Breadcrumb to the HOST's console, not this frame's.
 *
 * A view that renders at zero height, or inside a frame nobody can select in
 * devtools, is undebuggable from the inside. sendLog crosses back over the
 * transport, so these lines land where they can actually be read. Never let a
 * diagnostic break the thing it is diagnosing.
 */
function hostLog(message) {
  try {
    const p = app.sendLog({ level: 'info', data: '[xpoint] ' + message });
    if (p && typeof p.catch === 'function') p.catch(() => {});
  } catch (err) { /* a breadcrumb must never break what it reports on */ }
}

/**
 * Tell the host how tall we are.
 *
 * The SDK reports size on its own, but an app that is invisible despite a
 * successful handshake is the documented symptom of a zero-height frame, so
 * this reports explicitly after every render and refuses to report a height
 * so small that the panel could not be seen even if the host honoured it.
 */
const MIN_PANEL_HEIGHT = 240;
function reportSize() {
  try {
    const width = Math.ceil(document.documentElement.scrollWidth) || 320;
    const measured = Math.ceil(document.documentElement.scrollHeight);
    const height = Math.max(measured, MIN_PANEL_HEIGHT);
    const p = app.sendSizeChanged({ width, height });
    if (p && typeof p.catch === 'function') p.catch(() => {});
    return { width, height, measured };
  } catch (err) {
    return null;
  }
}

/**
 * Call a tool on our own server and return its text content.
 *
 * Every tool handler in src/index.js reports its own errors as ordinary
 * text content prefixed "Error: " rather than the isError flag (see the
 * catch block in the CallToolRequestSchema handler), so that prefix is
 * this view's only signal that a call failed.
 */
async function callTool(name, args) {
  const result = await app.callServerTool({ name, arguments: args || {} });
  const text = result && result.content && result.content[0] && result.content[0].text;
  if (typeof text !== 'string') throw new Error(`Tool "${name}" returned no text content`);
  if (text.startsWith('Error: ')) throw new Error(text.slice('Error: '.length));
  return text;
}

/**
 * The GETALL *tool* returns parsed JSON ({properties, nodes, methods}), but
 * buildGrid expects the raw `pr`/`pw`/`n-` lines the device itself sends.
 * Reconstructing them here — rather than changing buildGrid — is what
 * keeps the copied logic above byte-identical to src/xpoint.js.
 */
function linesFromGetAll(jsonText) {
  let parsed;
  try {
    parsed = JSON.parse(jsonText);
  } catch (err) {
    throw new Error(`GETALL did not return the expected JSON: ${err.message}`);
  }
  const properties = (parsed.properties || []).map(
    (p) => `${p.writable ? 'pw' : 'pr'} ${p.nodepath}.${p.property}=${p.value}`
  );
  const nodes = (parsed.nodes || []).map((n) => `n- ${n}`);
  return properties.concat(nodes);
}

// ---------------------------------------------------------------------
// Reading the device: three-or-more GETALL calls per refresh.
// ---------------------------------------------------------------------

async function fetchGrid() {
  const xpLines = linesFromGetAll(await callTool('GETALL', { path: `${XP_NODE}/*` }));

  // Which ports are destinations depends on the device family, so the model
  // decides it. A port-name pattern here would fit one family only, which is
  // the whole reason this panel exists.
  const first = buildUniversalGrid({ xpLines, switchableLines: [] });
  const destinations = first.destinations.map((d) => d.port);

  const switchableLines = [];
  for (const port of destinations) {
    try {
      switchableLines.push(...linesFromGetAll(await callTool('GETALL', { path: `${XP_NODE}/${port}/SWITCHABLE` })));
    } catch (err) {
      // Switchability is read per destination and must never be inferred
      // or predicted for one that failed to answer. A read failure here
      // leaves that destination's cells "Unavailable" (buildGrid's
      // default for absent data) rather than aborting the whole refresh
      // over routing and names that were already read successfully.
      console.error(`[xpoint-ui] SWITCHABLE read failed for ${port}:`, err.message);
    }
  }

  return buildUniversalGrid({ xpLines, switchableLines });
}

// ---------------------------------------------------------------------
// Rendering and interaction.
// ---------------------------------------------------------------------

/**
 * Report progress where it cannot be missed.
 *
 * Four releases were spent unable to tell "the document never rendered" from
 * "it rendered and failed silently". This says which, on screen, without
 * needing the console or a frame selector.
 */
function stage(text) {
  try {
    const el = document.getElementById('stage');
    if (!el) return;
    if (text === null) {
      el.hidden = true;
      return;
    }
    el.textContent = text;
    el.hidden = false;
  } catch (err) { /* never let the reporter break the thing it reports on */ }
}

const authEl = document.getElementById('auth');
const passwordEl = document.getElementById('auth-password');
const gridEl = document.getElementById('grid');
const bannerEl = document.getElementById('banner');
const statusEl = document.getElementById('status');
const appEl = document.getElementById('app');

let lastGrid = null;
let hydrated = false;
// Where the chat's instance found the device. Used to give this panel's own
// instance a connection so clicks can switch directly.
let connection = null;
let selfConnected = false;
// Held in memory for this panel only. Never persisted, never logged, and never
// put in structuredContent -- that is visible in the conversation's raw tool
// output view.
let devicePassword = null;
let pendingSwitch = null;
let busy = false;
let polling = false;

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function setBanner(message, { stale = false } = {}) {
  if (!message) {
    bannerEl.hidden = true;
    bannerEl.textContent = '';
    appEl.classList.remove('stale');
    return;
  }
  bannerEl.hidden = false;
  bannerEl.textContent = message;
  appEl.classList.toggle('stale', stale);
}

function setStatus(text) {
  statusEl.textContent = text;
}

function render(grid) {
  if (grid && grid.dialect === null) {
    // Better to say the device was not recognised than to draw an empty grid,
    // which reads as a device with nothing routed.
    gridEl.innerHTML = '';
    setBanner(`This device's crosspoint was not recognised: ${grid.reason}`, { stale: false });
    return;
  }
  if (!grid || grid.destinations.length === 0) {
    gridEl.innerHTML = '';
    setBanner('No crosspoint destinations were reported.', { stale: false });
    return;
  }

  // Colour is the only visual carrier, by choice. The tooltip still states the
  // signal in words, so it is not the only carrier outright.
  const signalClass = (p) =>
    p.signalPresent === true ? ' signal-yes' : p.signalPresent === false ? ' signal-no' : '';
  const signalTitle = (p) =>
    p.signalPresent === true
      ? 'signal present'
      : p.signalPresent === false
        ? 'no signal'
        : 'signal not reported by the device';
  // The disconnect token gets no column of its own: clicking the cell that is
  // already routed disconnects that destination instead. One fewer column, and
  // the action sits on the thing being undone.
  const columns = grid.sources.filter((s) => s.port !== grid.disconnect);

  const headerCells = columns
    .map(
      (s) =>
        `<th scope="col" class="port${signalClass(s)}" title="${escapeHtml(s.name)} — ${signalTitle(s)}">` +
        `${escapeHtml(s.name)}</th>`
    )
    .join('');
  const thead = `<thead><tr><th scope="col" class="corner"></th>${headerCells}</tr></thead>`;

  const canDisconnect = grid.disconnect !== null && grid.disconnect !== undefined;

  const rows = grid.destinations.map((d) => {
    const cells = columns.map((s) => {
      const state = cellState(grid, d.port, s.port);
      const classes = ['cell'];
      if (state.selected) classes.push('selected');
      if (!state.enabled) classes.push('disabled');

      // A routed cell stays clickable, and clicking it writes the disconnect
      // token rather than the source it names -- so the click handler itself
      // needs to know nothing about any of this.
      const clickable = state.selected ? canDisconnect : state.enabled;
      const clickValue = state.selected ? grid.disconnect : s.port;
      const attrs = clickable
        ? ` data-dest="${escapeHtml(d.port)}" data-src="${escapeHtml(clickValue)}" role="button" tabindex="0"`
        : '';

      const reason = state.selected
        ? canDisconnect
          ? 'Routed here — click to disconnect'
          : 'Routed here'
        : state.reason;
      const title = reason ? ` title="${escapeHtml(reason)}"` : '';

      let label = '';
      if (state.selected) label = '<span class="dot" aria-hidden="true"></span>';
      else if (!state.enabled && state.reason) label = escapeHtml(state.reason);

      return `<td class="${classes.join(' ')}"${title}${attrs}>${label}</td>`;
    }).join('');
    return (
      `<tr><th scope="row" class="port${signalClass(d)}" title="${escapeHtml(d.name)} — ${signalTitle(d)}">` +
      `${escapeHtml(d.name)}</th>${cells}</tr>`
    );
  }).join('');

  gridEl.innerHTML = `${thead}<tbody>${rows}</tbody>`;
}

/** Human label for a port, falling back to the raw code. */
function labelFor(list, port) {
  const hit = (list || []).find((entry) => entry.port === port);
  return hit && hit.name ? `${hit.name} (${port})` : port;
}

/**
 * Give this panel's own server instance a device connection.
 *
 * App-initiated tool calls land in a different instance than the chat's, and
 * that one has never connected to anything. Rather than route every switch
 * through the conversation, it connects itself using the address that came
 * with the grid.
 *
 * No password is passed, and none is available here by design: the panel runs
 * in a sandboxed frame and an admin password does not belong in it. A device
 * that requires one leaves this failing, and the caller falls back to asking
 * the conversation to switch.
 */
async function connectSelf() {
  if (selfConnected) return true;
  if (!connection || !connection.host) return false;
  // This panel's server instance is shared with every other panel, and it may
  // still hold whichever device an earlier one opened. connect refuses while a
  // connection exists ("Already connected"), so the panel would go on reading
  // and switching the previous device -- silently, since the grid it drew came
  // from the tool result and looks perfectly current.
  //
  // Dropping first is unconditional because the panel cannot tell what the
  // instance is attached to: status reports a host, but parsing prose to decide
  // whether to disconnect is a worse bet than one redundant reconnect.
  try {
    await callTool('disconnect', {});
  } catch (notConnected) {
    // "Not connected to any device" -- which is the state we wanted anyway.
  }

  const args = { host: connection.host, port: connection.port };
  // Reconnect over whatever answered for the chat. Without this a wss device
  // reports port 443, TCP connects to its HTTPS listener, and every command
  // times out against a socket that was never speaking LW3.
  if (connection.transport === 'wss') args.transport = 'wss';
  if (devicePassword) args.password = devicePassword;
  await callTool('connect', args);
  selfConnected = true;
  return true;
}

/**
 * Switch a destination to a source.
 *
 * The direct SET is tried first, so this needs no changing if a host ever
 * routes app-initiated calls to the instance holding the device connection.
 * Today they reach a different one, which cannot see the device at all, so the
 * fallback asks the conversation to perform the switch: Claude runs SET
 * through the connected instance and its fresh xpoint result draws the
 * updated grid. The click still switches -- by a longer road.
 */
async function switchRoute(destPort, srcPort) {
  if (busy) return;
  busy = true;

  const destLabel = labelFor(lastGrid && lastGrid.destinations, destPort);
  const disconnecting = lastGrid && srcPort === lastGrid.disconnect;
  const srcLabel = disconnecting ? 'disconnected' : labelFor(lastGrid && lastGrid.sources, srcPort);

  try {
    setStatus(`Switching ${destLabel} → ${srcLabel}…`);

    // Point this instance at the right device BEFORE writing anything.
    //
    // This used to be an error fallback: try the SET, and connect only if it
    // failed. But the instance is shared with every other panel, so it may
    // already hold a different device -- and then the SET SUCCEEDS, against the
    // wrong hardware, with the panel redrawing to show what it just switched.
    // Confirming first is the difference between a mis-routed matrix and a
    // refused click.
    if (!selfConnected) {
      try {
        const opened = await connectSelf();
        if (!opened) throw new Error('No device address travelled with this panel');
      } catch (connectError) {
        if (/requires authentication|rejected that password/i.test(connectError.message)) {
          pendingSwitch = { destPort, srcPort };
          setStatus(`${destLabel} → ${srcLabel} needs the device password`);
          setBanner(connectError.message, { stale: false });
          authEl.hidden = false;
          passwordEl.focus();
          reportSize();
          busy = false;
          return;
        }
        // Deliberately no SET attempt here. A write to an instance whose device
        // is unconfirmed could land on the wrong matrix; asking the chat routes
        // it through the connection that is known to be right.
        await askChatToSwitch(destPort, srcPort, destLabel, srcLabel, connectError);
        busy = false;
        return;
      }
    }

    await callTool('SET', {
      nodepath: `${XP_NODE}/${destPort}`,
      // ConnectedSource on one family, SourceStream on another. The grid says
      // which, so nothing here has to know the device.
      property: (lastGrid && lastGrid.routeProp) || 'ConnectedSource',
      value: srcPort,
    });
    // A switch can change which sources are Busy at *other* destinations (two
    // outputs sharing one input on the crosspoint chip, say), so the read after
    // a switch covers SWITCHABLE too, not just routing.
    await refresh();
    setStatus(`Switched ${destLabel} → ${srcLabel}`);
  } catch (switchError) {
    await askChatToSwitch(destPort, srcPort, destLabel, srcLabel, switchError);
  } finally {
    busy = false;
  }
}

/**
 * Ask the conversation to perform a switch this panel could not.
 *
 * sendMessage does not send: the host offers the text to the composer and the
 * user accepts it and presses Enter. Worth saying so, rather than reporting the
 * switch as requested and leaving them waiting.
 */
async function askChatToSwitch(destPort, srcPort, destLabel, srcLabel, cause) {
  try {
    await app.sendMessage({
      role: 'user',
      content: [
        {
          type: 'text',
          // Port codes as well as names: the model needs the exact SET values,
          // and the names alone are ambiguous.
          text:
            `Set ${XP_NODE}/${destPort}.${(lastGrid && lastGrid.routeProp) || 'ConnectedSource'} to ${srcPort} ` +
            `(switch ${destLabel} to ${srcLabel}), then run xpoint to show the result.`,
        },
      ],
    });
    setStatus(`Staged: ${destLabel} → ${srcLabel} — accept the prompt, then press Enter`);
    stage(null);
  } catch (askError) {
    setBanner(
      `Could not switch ${destLabel}: ${cause.message}. ` +
        `Asking Claude also failed: ${askError && askError.message ? askError.message : String(askError)}`,
      { stale: true }
    );
  }
}

authEl.addEventListener('submit', (event) => {
  event.preventDefault();
  const entered = passwordEl.value;
  if (!entered) return;

  devicePassword = entered;
  passwordEl.value = '';
  authEl.hidden = true;
  setBanner(null);
  reportSize();

  const retry = pendingSwitch;
  pendingSwitch = null;
  if (retry) switchRoute(retry.destPort, retry.srcPort);
});

gridEl.addEventListener('click', (event) => {
  const td = event.target.closest('td[data-dest]');
  if (!td) return;
  switchRoute(td.dataset.dest, td.dataset.src);
});

gridEl.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  const td = event.target.closest('td[data-dest]');
  if (!td) return;
  event.preventDefault();
  switchRoute(td.dataset.dest, td.dataset.src);
});

async function refresh() {
  try {
    const grid = await fetchGrid();
    lastGrid = grid;
    render(grid);
    stage(null);
    const size = reportSize();
    hostLog(
      'rendered ' + grid.destinations.length + 'x' + grid.sources.length +
      ' grid; size ' + JSON.stringify(size)
    );
    setBanner(null);
    setStatus(`Updated ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    // Keep whatever was last drawn — a blank panel reads as "nothing is
    // routed", which is a stronger and different claim than "the last
    // read failed".
    if (lastGrid) render(lastGrid);
    if (hydrated) {
      // The grid on screen came with the tool result and is still what the
      // device reported. Only live refresh is unavailable, so say that rather
      // than raising an alarm over data that is fine.
      // Expected, not a fault: the panel's own tool calls reach a different
      // server instance than the one holding the device connection, so the
      // refresh was never going to work. The grid on screen came with the tool
      // result and is exactly what the device reported. A quiet status line
      // says so; the red bar is for things that are actually wrong.
      stage(null);
      setStatus('Snapshot — re-run xpoint to refresh');
    } else {
      stage('device read FAILED: ' + (err && err.message ? err.message : String(err)));
      setBanner(err.message, { stale: true });
    }
  }
}

(async function main() {
  stage('module evaluated; calling connect()');
  setStatus('Connecting…');

  let connected = false;
  let failure = null;
  try {
    await app.connect();
    connected = true;
  } catch (err) {
    failure = err && err.message ? err.message : String(err);
  }

  // Before anything else, and whether or not the handshake worked. The old
  // order returned from the catch without ever reporting a size, so the very
  // message explaining the failure was rendered into a frame of zero height.
  const size = reportSize();
  stage(
    connected
      ? 'connect() OK; size ' + JSON.stringify(size) + '; reading device…'
      : 'connect() FAILED: ' + failure
  );

  if (!connected) {
    setStatus('Not connected');
    setBanner('Could not connect to the host: ' + failure, { stale: true });
    reportSize();
    return;
  }

  // Diagnostics only, after the panel is already in a good state: nothing
  // below may decide whether the panel works.
  try {
    hostLog('connect() resolved; host context: ' + JSON.stringify(app.getHostContext() || null));
  } catch (err) { /* ignore */ }

  // Deliberately no refresh here. The grid came with the tool result, read by
  // the instance the chat connected. This panel's instance may still hold a
  // different device entirely, and refreshing from it would quietly replace
  // correct data with another device's -- which looks like a working panel.
  // Live polling begins only once connectSelf has pointed this instance at the
  // device the grid is actually about, which the first click does.
  setInterval(() => {
    // switchRoute's own `await refresh()` is deliberately not gated by this:
    // the post-switch re-read must always happen.
    if (!selfConnected || document.hidden || busy || polling) return;
    polling = true;
    refresh().finally(() => { polling = false; });
  }, POLL_MS);
})();
</script>
</body>
</html>

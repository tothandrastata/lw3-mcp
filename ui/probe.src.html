<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MCP Apps probe</title>
<style>
  /*
   * Deliberately crude. This panel exists to answer one question -- does this
   * host render an MCP App at all -- so it must be impossible to miss and
   * impossible to blame on layout. Fixed height, loud colour, no dependency on
   * anything the host tells us.
   */
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 320px;
    background: #b00020;
    color: #ffffff;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .box { padding: 1.25rem; }
  h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
  code { background: rgba(255, 255, 255, 0.18); padding: 0 0.25rem; border-radius: 3px; }
  #state { margin-top: 0.75rem; font-weight: 600; }
</style>
</head>
<body>
<div class="box">
  <h1>MCP Apps probe</h1>
  <p>If you can read this, this host renders MCP Apps and the fault is in the
     crosspoint panel, not in the extension's wiring.</p>
  <div id="state">static HTML rendered; JavaScript has not run yet</div>
</div>
<script type="module">
/* __MCP_APPS_SDK__ */

// Two independent things are under test, and they are reported separately on
// purpose:
//
//   1. Does the host paint this document at all? The red box answers that with
//      no JavaScript involved -- it is plain HTML and CSS with a fixed height.
//   2. Does the SDK handshake complete? Only the line below changes if so.
//
// Keeping them apart is the point: a blank frame and a red box that never
// updates are different failures with different fixes.

const state = document.getElementById('state');

function show(text) {
  state.textContent = text;
}

const app = new App({ name: 'lw3-probe', version: '1.0.0' });
app.onerror = (err) => { show('app error: ' + (err && err.message ? err.message : String(err))); };

(async function main() {
  show('JavaScript running; calling connect()…');
  try {
    await app.connect();
  } catch (err) {
    show('connect() FAILED: ' + (err && err.message ? err.message : String(err)));
    return;
  }

  try {
    app.sendLog({ level: 'info', data: '[probe] connect() resolved' });
  } catch (err) { /* ignore */ }

  const width = Math.ceil(document.documentElement.scrollWidth) || 320;
  const height = Math.max(Math.ceil(document.documentElement.scrollHeight), 320);
  try {
    await app.sendSizeChanged({ width, height });
    app.sendLog({ level: 'info', data: `[probe] size ${width}x${height}` });
  } catch (err) { /* ignore */ }

  show(`connect() OK — reported ${width}x${height}. MCP Apps works here.`);
})();
</script>
</body>
</html>
